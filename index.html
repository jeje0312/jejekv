<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>수리논술 파이널 14회</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 회차 목록(홈) → 회차 화면(문항 탭 + 원본 이미지 + 해설 펼치기 + 타이머). 흑백 위주, 종이 원본을 그대로 보여주는 열람용 화면. */
:root{
  --bg:#f6f6f4; --paper:#ffffff; --fg:#141414; --muted:#6b6b68; --line:#d9d9d5; --soft:#ececea; --ink:#141414; --ink-fg:#ffffff; --done:#2f6f4e;
  --f-display:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121212;--paper:#1c1c1c;--fg:#ededeb;--muted:#9a9a96;--line:#333331;--soft:#262625;--ink:#ededeb;--ink-fg:#121212;--done:#7cc59e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121212;--paper:#1c1c1c;--fg:#ededeb;--muted:#9a9a96;--line:#333331;--soft:#262625;--ink:#ededeb;--ink-fg:#121212;--done:#7cc59e;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;min-height:56px;flex-wrap:wrap;padding-block:8px}
.brand{font-family:var(--f-display);font-weight:700;font-size:17px;text-decoration:none;letter-spacing:-.01em;margin-right:auto}
.brand small{font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:13px;margin-left:8px}
.theme{border:1px solid var(--line);background:none;border-radius:6px;padding:4px 10px;font-size:13px;color:var(--muted)}
main{padding-block:28px 64px}
h1{font-family:var(--f-display);font-size:28px;line-height:1.3;margin:0 0 6px;text-wrap:balance;letter-spacing:-.02em}
.lede{color:var(--muted);margin:0 0 28px;max-width:62ch}
.sec-label{font-size:12px;letter-spacing:.08em;color:var(--muted);margin:40px 0 12px;text-transform:uppercase}
/* home grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:16px;text-decoration:none;min-width:0;transition:border-color .15s}
.card:hover{border-color:var(--fg)}
.card .no{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.card .no b{font-family:var(--f-display);font-size:21px;letter-spacing:-.02em}
.card .no span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted);white-space:nowrap}
.bar{height:3px;background:var(--soft);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--done)}
.card .tag{font-size:12px;color:var(--fg)}
/* school index */
.schools{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
details.school{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:0 14px}
details.school summary{cursor:pointer;padding:12px 0;display:flex;justify-content:space-between;gap:8px;list-style:none}
details.school summary::-webkit-details-marker{display:none}
details.school summary span{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
details.school ul{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column}
details.school li a{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid var(--soft);text-decoration:none;font-size:14px}
details.school li a span{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
/* round view */
.rhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.rhead .meta{color:var(--muted);font-size:13px}
.back{font-size:13px;color:var(--muted);text-decoration:none;display:inline-block;margin-bottom:8px}
.timer{display:flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 8px;flex-wrap:wrap}
.timer .clock{font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums;min-width:5.2ch;text-align:right;padding:0 4px}
.timer .clock.over{color:#b3261e}
.timer select,.timer button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 8px;font-size:13px;color:var(--fg)}
.timer button.main{background:var(--ink);color:var(--ink-fg);border-color:var(--ink);min-width:4.5em}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;scrollbar-width:thin}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:6px 10px;font-size:13px;line-height:1.3;text-align:left;display:flex;flex-direction:column;min-width:64px}
.tabs button b{font-variant-numeric:tabular-nums}
.tabs button small{color:var(--muted);font-size:11px}
.tabs button.on{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.tabs button.on small{color:inherit;opacity:.75}
.tabs button.done:not(.on){border-color:var(--done)}
.tabs button.done b::after{content:" ✓";color:var(--done)}
.tabs button.on.done b::after{color:inherit}
.qhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:4px 0 12px}
.qhead h2{font-family:var(--f-display);font-size:22px;margin:0;letter-spacing:-.01em}
.qhead .src{color:var(--muted);font-size:14px}
.sheet{background:#fff;border:1px solid var(--line);border-radius:4px;padding:8px;display:flex;flex-direction:column;gap:8px}
.sheet img{display:block;width:100%;height:auto;max-width:100%}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:8px 14px;font-size:14px}
.btn.primary{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.btn.check.on{border-color:var(--done);color:var(--done)}
.spacer{flex:1}
.solhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:28px 0 10px;padding-top:20px;border-top:1px solid var(--line)}
.solhead h3{margin:0;font-family:var(--f-display);font-size:18px}
.note{font-size:13px;color:var(--muted)}
.keys{font-size:12px;color:var(--muted);margin-top:24px}
kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px}
@media (max-width:560px){h1{font-size:23px}.qhead h2{font-size:19px}.sheet{padding:4px}.timer .clock{font-size:18px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#home">수리논술 파이널 <small>의학계열 · 14회</small></a>
  <button class="theme" id="themeBtn" type="button">테마</button>
</div></header>
<main class="wrap" id="app"></main>

(function(){
const D = window.DATA, app = document.getElementById('app');
const SHORT = {'가톨릭':'가톨릭','성균관':'성균관','경희':'경희','중앙':'중앙','인하':'인하','연세':'연세(미래)','경북':'경북','이화':'이화','한양':'한양','아주':'아주','가천':'가천','부산':'부산','단국':'단국'};
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let done = store.get('sn-done',{});
const isDone = id => !!done[id];
function toggleDone(id){done[id]=!done[id]; if(!done[id]) delete done[id]; store.set('sn-done',done)}
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function img(f){return `<img src="img/${f.f}" width="${f.w}" height="${f.h}" loading="lazy" decoding="async" alt="">`}
function counts(items){const m={};items.forEach(i=>m[i.school]=(m[i.school]||0)+1);return Object.entries(m).sort((a,b)=>b[1]-a[1])}

/* theme toggle */
const tb=document.getElementById('themeBtn');
function applyTheme(t){if(t)document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme');tb.textContent=t==='dark'?'다크':t==='light'?'라이트':'시스템'}
let theme=store.get('sn-theme',null);applyTheme(theme);
tb.onclick=()=>{theme=theme==null?'light':theme==='light'?'dark':null;store.set('sn-theme',theme);applyTheme(theme)};

/* home */
function home(){
  const total=D.sets.reduce((a,s)=>a+s.items.length,0);
  const solved=D.sets.reduce((a,s)=>a+s.items.filter(i=>isDone(i.id)).length,0);
  let h=`<h1>의학계열 수리논술 파이널 모의고사</h1>
  <p class="lede">2023~2026학년도 의대 논술 수학 기출 ${total}문항을 14회로 묶었어. 문제는 대학 원본을 그대로 잘라 넣었고, 해설은 대학 공식 예시답안이야. 공식 해설이 없는 문항만 직접 작성 해설로 표시돼 있어. 지금까지 ${solved}/${total}문항 체크.</p>
  <div class="sec-label">회차</div><div class="grid">`;
  D.sets.forEach(s=>{
    const n=s.items.length, d=s.items.filter(i=>isDone(i.id)).length;
    const tag = s.n<=2 ? '<span class="tag">우선 추천 회차</span>' : '';
    h+=`<a class="card" href="#r${s.n}">
      <div class="no"><b>제${s.n}회</b><span>${d}/${n}</span></div>
      <div class="chips">${counts(s.items).map(([k,v])=>`<span class="chip">${esc(SHORT[k]||k)} ${v}</span>`).join('')}</div>
      <div class="bar"><i style="width:${n?100*d/n:0}%"></i></div>${tag}</a>`;
  });
  h+=`</div><div class="sec-label">학교별로 찾기</div><div class="schools">`;
  const by={};
  D.sets.forEach(s=>s.items.forEach((it,k)=>{(by[it.school]=by[it.school]||[]).push({it,n:s.n,k:k+1})}));
  Object.entries(by).sort((a,b)=>b[1].length-a[1].length).forEach(([sc,arr])=>{
    arr.sort((a,b)=>a.it.label.localeCompare(b.it.label,'ko',{numeric:true}));
    h+=`<details class="school"><summary><b>${esc(SHORT[sc]||sc)}</b><span>${arr.length}문항</span></summary><ul>`+
      arr.map(x=>`<li><a href="#r${x.n}-${x.k}">${esc(x.it.label)}<span>${x.n}회 ${x.k}번${isDone(x.it.id)?' ✓':''}</span></a></li>`).join('')+`</ul></details>`;
  });
  h+=`</div>`;
  app.innerHTML=h; document.title='수리논술 파이널 14회';
}

/* timer (per round, in memory + saved) */
let T={n:0,total:0,left:0,run:false,last:0,id:null};
function fmt(s){const neg=s<0;s=Math.abs(Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (neg?'-':'')+(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')}
function saveT(){store.set('sn-timer-'+T.n,{total:T.total,left:T.left})}
function loadT(n){const v=store.get('sn-timer-'+n,null);T.n=n;T.run=false;clearInterval(T.id);T.total=v?v.total:30*60;T.left=v?v.left:T.total}
function paintT(){const c=document.getElementById('clk');if(!c)return;c.textContent=fmt(T.left);c.classList.toggle('over',T.left<0);const b=document.getElementById('tgo');if(b)b.textContent=T.run?'정지':(T.left===T.total?'시작':'계속')}
function tick(){const now=Date.now();T.left-=(now-T.last)/1000;T.last=now;paintT();saveT()}
function startStop(){if(T.run){T.run=false;clearInterval(T.id);saveT()}else{T.run=true;T.last=Date.now();T.id=setInterval(tick,250)}paintT()}

/* round */
let cur={n:0,k:1,sol:false};
function round(n,k){
  const s=D.sets[n-1]; if(!s) return home();

  else if(cur.k!==k) cur.sol=false;
  cur.n=n;cur.k=k;
  const it=s.items[k-1];
  const opts=[20,25,30,40,50,60,90,100,120,180].map(m=>`<option value="${m}"${T.total===m*60?' selected':''}>${m}분</option>`).join('');
  let h=`<a class="back" href="#home">← 회차 목록</a>
  <div class="rhead"><div><h1>제${n}회</h1><div class="meta">${s.items.length}문항 · ${counts(s.items).map(([k,v])=>esc(SHORT[k]||k)+' '+v).join(' · ')}</div></div>

    <span class="spacer"></span>
    <button class="btn" id="prevBtn" type="button" ${k===1?'disabled':''}>← 이전</button>
    <button class="btn" id="nextBtn" type="button" ${k===s.items.length?'disabled':''}>다음 →</button>
  </div>
  <div id="sol" ${cur.sol?'':'hidden'}>
    <div class="solhead"><h3>해설</h3><span class="note">${it.mine?'대학이 해설을 공개하지 않아 직접 작성한 해설':'대학 공식 예시답안·채점기준 원본'}</span></div>
    <div class="sheet">${cur.sol?it.s.map(img).join(''):''}</div>
  </div>
  <p class="keys"><kbd>←</kbd> <kbd>→</kbd> 문항 이동 · <kbd>S</kbd> 해설 펼치기 · <kbd>Space</kbd> 타이머</p>`;
  app.innerHTML=h; document.title=`제${n}회 ${k}번 · 수리논술 파이널`;
  paintT();
  app.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>go(n,+b.dataset.k));
  const on=app.querySelector('.tabs .on'); if(on) on.scrollIntoView({block:'nearest',inline:'center'});
  document.getElementById('solBtn').onclick=()=>{cur.sol=!cur.sol;round(n,k);if(cur.sol)document.getElementById('sol').scrollIntoView({behavior:'smooth',block:'start'})};
  document.getElementById('doneBtn').onclick=()=>{toggleDone(it.id);round(n,k)};
  document.getElementById('prevBtn').onclick=()=>go(n,k-1);
  document.getElementById('nextBtn').onclick=()=>go(n,k+1);
  document.getElementById('tgo').onclick=startStop;
  document.getElementById('treset').onclick=()=>{T.run=false;clearInterval(T.id);T.left=T.total;saveT();paintT()};
  document.getElementById('tset').onchange=e=>{T.total=+e.target.value*60;if(!T.run)T.left=T.total;saveT();paintT()};
}
function go(n,k){location.hash='r'+n+'-'+k}
function route(){
  const m=/^#r(\d+)(?:-(\d+))?$/.exec(location.hash);
  if(m){const n=+m[1],k=+(m[2]||1);const same=cur.n===n;round(n,k);if(!same||true)window.scrollTo(0,0)}
  else {if(T.run){T.run=false;clearInterval(T.id);saveT()}cur.n=0;home()}
}
window.addEventListener('hashchange',route);
document.addEventListener('keydown',e=>{
  if(!cur.n||e.target.closest('select,input,textarea'))return;
  if(e.key==='ArrowRight'&&cur.k<D.sets[cur.n-1].items.length)go(cur.n,cur.k+1);
  else if(e.key==='ArrowLeft'&&cur.k>1)go(cur.n,cur.k-1);
  else if(e.key==='s'||e.key==='S'){document.getElementById('solBtn').click()}
  else if(e.key===' '&&!e.target.closest('button')){e.preventDefault();startStop()}
});
route();
})();
</script>

</body>
</html>
